<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1540" />
<title>جاسوس</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap" />
<style>
  :root { --ink:#0e1540; --night:#18235c; --night2:#212d6e; --chip:#2a3680; --red:#d4152f; --lamp:#f3d567; --teal:#4fc3d6; --text:#eceefa; --soft:#c6cbec; --muted:#b9c1ea; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ink); color: var(--text); font-family: Vazirmatn, Tahoma, sans-serif; min-height: 100%; }
  body { overflow-x: hidden; }
  .beam { position: fixed; left: 50%; top: -10%; width: 140vh; height: 140vh; margin-left: -70vh; pointer-events: none; transform-origin: 50% 0;
    background: conic-gradient(from 180deg at 50% 0%, transparent 0deg, transparent 165deg, rgba(243,213,103,.10) 175deg, rgba(243,213,103,.16) 180deg, rgba(243,213,103,.10) 185deg, transparent 195deg, transparent 360deg);
    animation: sweep 26s ease-in-out infinite; }
  @keyframes sweep { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(28deg); } }
  main { position: relative; max-width: 460px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding: 32px 20px 40px; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .display { font-family: Lalezar, Vazirmatn, sans-serif; font-weight: 400; line-height: 1.05; margin: 0; }
  .hero { font-size: clamp(84px, 27vw, 132px); color: var(--lamp); text-align: center; text-shadow: 0 6px 0 rgba(212,21,47,.9); margin-top: 16px; }
  .tag { text-align: center; color: var(--soft); font-size: 18px; margin: 12px 0 0; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .top .display { font-size: 30px; color: var(--lamp); }
  .muted { color: var(--muted); font-size: 14px; }
  .label { color: var(--muted); font-weight: 700; font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .label span { font-weight: 400; font-size: 14px; }
  .btn { width: 100%; border: 0; border-radius: 16px; padding: 16px 24px; font: 800 18px Vazirmatn, sans-serif; cursor: pointer; transition: transform .1s, background .2s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .red { background: var(--red); color: #fff; } .lamp { background: var(--lamp); color: var(--ink); } .ghost { background: var(--night); color: var(--text); }
  .link { background: none; border: 0; color: var(--muted); font: 700 14px Vazirmatn, sans-serif; cursor: pointer; padding: 8px; }
  .link:hover { color: var(--text); }
  .pulse { animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(212,21,47,.55); } 50% { box-shadow: 0 0 0 14px rgba(212,21,47,0); } }
  .stack > * + * { margin-top: 12px; }
  input.field { width: 100%; border: 0; outline: 0; background: var(--night); color: var(--text); border-radius: 16px; padding: 14px 16px; font: 500 17px Vazirmatn, sans-serif; }
  input.field::placeholder { color: rgba(185,193,234,.7); }
  input.field:focus, input.code:focus { box-shadow: 0 0 0 3px rgba(243,213,103,.45); }
  input.code { width: 100%; border: 0; outline: 0; background: var(--night); color: var(--lamp); border-radius: 24px; padding: 14px; text-align: center; font: 400 56px Lalezar, sans-serif; letter-spacing: .2em; direction: ltr; }
  input.code::placeholder { color: var(--chip); }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-weight: 700; font-size: 14px; margin: 28px 0; }
  .or::before, .or::after { content: ""; height: 1px; flex: 1; background: var(--chip); }
  .err { min-height: 24px; text-align: center; color: #ffc3c5; font-weight: 700; margin: 8px 0 0; }
  .ticket { position: relative; overflow: hidden; border: 0; width: 100%; border-radius: 28px; background: var(--lamp); color: var(--ink); padding: 16px 24px 20px; text-align: center; cursor: pointer; font-family: Vazirmatn, sans-serif; }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 32px; height: 32px; margin-top: -16px; border-radius: 50%; background: var(--ink); }
  .ticket::before { right: -16px; } .ticket::after { left: -16px; }
  .ticket .t1 { font-weight: 700; opacity: .7; margin: 0; font-size: 16px; } .ticket .t2 { font-size: clamp(64px, 20vw, 92px); letter-spacing: .08em; direction: ltr; line-height: 1; margin: 4px 0; } .ticket .t3 { font-weight: 700; opacity: .7; margin: 0; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
  .chip { display: flex; align-items: center; gap: 8px; background: var(--night); border-radius: 999px; padding: 6px 16px 6px 6px; font-weight: 700; }
  .chip.me { background: var(--lamp); color: var(--ink); } .chip.off { opacity: .6; }
  .chip small { font-weight: 500; opacity: .7; font-size: 13px; }
  .av { width: 30px; height: 30px; border-radius: 50%; background: var(--chip); color: var(--lamp); display: grid; place-items: center; font-weight: 800; flex-shrink: 0; font-size: 13px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 0; border-radius: 999px; padding: 8px 16px; font: 700 16px Vazirmatn, sans-serif; background: var(--night); color: var(--soft); cursor: pointer; }
  .pill.on { background: var(--text); color: var(--ink); } .pill:disabled { cursor: default; }
  .stepper { display: flex; justify-content: space-between; align-items: center; background: var(--night); border-radius: 16px; padding: 12px 16px; font-weight: 700; }
  .stepper .ctl { display: flex; align-items: center; gap: 12px; }
  .stepper button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--chip); color: var(--text); font-size: 20px; cursor: pointer; }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper b { min-width: 64px; text-align: center; color: var(--lamp); font-size: 18px; }
  .clock { font-family: Lalezar, sans-serif; font-size: 72px; line-height: 1; text-align: center; direction: ltr; }
  .clock.low { color: var(--red); }
  .card { position: relative; width: 100%; aspect-ratio: 4/3; border: 0; padding: 0; border-radius: 28px; overflow: hidden; background: var(--night); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; font-family: Vazirmatn, sans-serif; }
  .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
  .face.citizen { background: var(--lamp); color: var(--ink); } .face.spy { background: var(--red); color: #fff; }
  .face p { margin: 0; font-weight: 700; opacity: .8; font-size: 16px; }
  .face .display { font-size: 56px; opacity: 1; margin: 4px 0; }
  .flap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--night) repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 14px); transition: transform .35s cubic-bezier(.3,1.4,.5,1); color: var(--text); }
  .card.open .flap { transform: translateY(-101%); }
  .flap .stamp { position: absolute; right: 20px; top: 16px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .seal { width: 112px; height: 112px; border-radius: 50%; background: var(--red); display: grid; place-items: center; transform: rotate(-8deg); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25), 0 8px 24px rgba(212,21,47,.35); position: relative; }
  .seal::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.35); }
  .flap .hint { margin: 20px 0 0; font-weight: 700; font-size: 18px; } .flap .hint2 { margin: 0; color: var(--muted); font-size: 14px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--night); border-radius: 16px; padding: 12px 16px; }
  .row b { color: var(--lamp); }
  .pick { display: flex; width: 100%; align-items: center; gap: 12px; border: 0; border-radius: 16px; padding: 12px 16px; background: var(--night); color: var(--text); font: 700 18px Vazirmatn, sans-serif; cursor: pointer; text-align: start; }
  .pick.on { background: var(--red); color: #fff; } .pick small { margin-inline-start: auto; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid button { border: 0; border-radius: 12px; padding: 12px; background: var(--night); color: var(--text); font: 700 16px Vazirmatn, sans-serif; cursor: pointer; }
  .grid button:hover { background: var(--red); }
  .bar { height: 8px; border-radius: 99px; background: var(--night); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--lamp); border-radius: 99px; transition: width .4s; }
  .verdict { align-self: center; border: 5px solid; border-radius: 22px; padding: 12px 28px; transform: rotate(-7deg); animation: slam .5s cubic-bezier(.3,1.6,.5,1) .15s both; }
  .verdict .display { font-size: 56px; }
  @keyframes slam { from { transform: scale(2.4) rotate(-22deg); opacity: 0; } }
  .v-spy { border-color: var(--red); color: var(--red); } .v-town { border-color: #1f8a9e; color: var(--teal); }
  .box { border-radius: 24px; padding: 18px 24px; }
  .score { display: flex; align-items: center; gap: 12px; background: var(--night); border-radius: 16px; padding: 10px 16px; font-weight: 700; }
  .score .display { margin-inline-start: auto; color: var(--lamp); font-size: 24px; }
  .grow { flex: 1; } .center { text-align: center; } .mt8 { margin-top: 32px; } .mt4 { margin-top: 16px; } .mt6 { margin-top: 24px; }
  .banner { background: var(--night); border-radius: 999px; padding: 8px 16px; text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .blink { animation: blink 1.6s infinite; } @keyframes blink { 50% { opacity: .55; } }

  /* ---- نشانه‌های کنار اسم ---- */
  .ico { display: inline-flex; flex-shrink: 0; }
  .nosig { color: #ff8a98; } .micon { color: var(--teal); }
  .kick { width: 26px; height: 26px; margin-inline-start: 2px; border: 0; border-radius: 50%; background: rgba(212,21,47,.18); color: #ff9aa6; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .chip.me .kick { display: none; }
  .kick:hover { background: var(--red); color: #fff; }

  /* ---- QR زیر کد اتاق ---- */
  .qr { width: 92px; height: 92px; margin: 8px auto 6px; padding: 6px; background: #fff; border-radius: 14px; box-shadow: 0 4px 0 rgba(14,21,64,.18); }
  .qr svg { display: block; width: 100%; height: 100%; }

  /* ---- ورودی عددی ---- */
  input.num { width: 64px; border: 0; outline: 0; border-radius: 12px; padding: 6px 4px; background: var(--chip); color: var(--lamp); font: 800 20px Vazirmatn, sans-serif; text-align: center; }
  input.num:focus { box-shadow: 0 0 0 3px rgba(243,213,103,.45); }
  input.num:disabled { background: transparent; }
  .unit { color: var(--soft) !important; font-size: 16px !important; min-width: 0 !important; }
  .addw { display: flex; gap: 8px; }
  .addw .field { flex: 1; min-width: 0; }
  .addw .btn { width: auto; padding: 12px 18px; font-size: 16px; flex-shrink: 0; }
  select.field { appearance: none; -webkit-appearance: none; cursor: pointer; font: 700 16px Vazirmatn, sans-serif; width: auto; padding: 12px 16px; border: 0; outline: 0; background: var(--night); color: var(--text); border-radius: 16px; }
  .wchips .chip { padding: 6px 8px 6px 14px; font-size: 15px; }

  /* ---- پایان بازی ---- */
  .champ { background: var(--night2); border-radius: 24px; padding: 18px 20px; }
  .champ .display { color: var(--lamp); font-size: 40px; }
  .score.top { background: var(--lamp); color: var(--ink); } .score.top .display { color: var(--ink); }

  /* ---- داک پایین: میکروفون، چت، هدفون ---- */
  body.inroom main { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
  .dockbar { position: fixed; z-index: 30; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(440px, calc(100% - 24px));
    display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; padding: 8px; border-radius: 26px; background: rgba(24,35,92,.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 12px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06); }
  .dk { position: relative; border: 0; border-radius: 20px; padding: 8px 4px 6px; background: transparent; color: var(--soft); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font: 700 13px Vazirmatn, sans-serif; transition: background .2s, color .2s, transform .1s; }
  .dk:active { transform: scale(.95); }
  .dk svg { width: 26px; height: 26px; }
  .dk.on { background: var(--teal); color: var(--ink); }
  .dk.mic.on { background: var(--red); color: #fff; }
  .dk.chatb { background: var(--lamp); color: var(--ink); }
  .dk.chatb.open { background: var(--text); }
  .badge { position: absolute; top: 2px; inset-inline-end: 18%; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--red); color: #fff; font: 800 13px/22px Vazirmatn, sans-serif; text-align: center; box-shadow: 0 0 0 3px rgba(24,35,92,.92); }
  .dk.on .live { position: absolute; top: 8px; inset-inline-start: 22%; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1.4s infinite; }

  .sheet { position: fixed; z-index: 29; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); width: min(440px, calc(100% - 24px));
    height: min(62vh, 560px); height: min(62dvh, 560px); transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
    display: flex; flex-direction: column; border-radius: 26px; background: #141d52; box-shadow: 0 18px 48px rgba(0,0,0,.5); transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s; overflow: hidden; }
  .sheet.open { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; }
  .sheet-h .display { color: var(--lamp); font-size: 26px; }
  .msgs { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msgs .empty { margin: auto; text-align: center; color: var(--muted); font-size: 15px; padding: 0 24px; }
  .msg { max-width: 82%; align-self: flex-end; background: var(--chip); border-radius: 18px 18px 18px 6px; padding: 8px 12px; }
  .msg.me { align-self: flex-start; background: var(--lamp); color: var(--ink); border-radius: 18px 18px 6px 18px; }
  .msg small { display: block; font-size: 13px; font-weight: 700; color: var(--teal); }
  .msg.me small { display: none; }
  .msg p { margin: 0; font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
  .msg.q { align-self: stretch; max-width: none; background: transparent; border: 2px solid var(--red); border-radius: 18px; padding: 10px 14px; }
  .msg.q .qh { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #ff9aa6; font-weight: 700; }
  .msg.q .qh b { color: var(--text); font-size: 16px; }
  .msg.q p { font-size: 18px; font-weight: 800; margin-top: 2px; }
  .msg.q small { color: var(--muted); font-weight: 500; margin-top: 2px; display: block !important; }
  .msg.q.forme { background: rgba(212,21,47,.16); }
  .composer { padding: 10px 12px 12px; background: rgba(14,21,64,.55); }
  .composer form { display: flex; gap: 8px; }
  .composer .field { flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px; }
  .send { width: 48px; height: 48px; flex-shrink: 0; border: 0; border-radius: 16px; background: var(--lamp); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  .qbtn { margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; font-size: 16px; background: transparent; color: var(--text); box-shadow: inset 0 0 0 2px var(--red); }
  .qbtn:active { background: var(--red); }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } .beam { animation: none; } }
</style>

<body>
<div class="beam" aria-hidden="true"></div>
<main id="app"></main>
<div id="dock"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, doc, collection, setDoc, updateDoc, getDoc, getDocs, deleteDoc, addDoc, onSnapshot, writeBatch, serverTimestamp, query, orderBy, limitToLast, where } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { CATEGORIES, QUESTIONS } from "./words.js";
import { wordsOf, totalRounds, MAX_MINUTES, MAX_ROUNDS } from "./game.js";
import { createNet } from "./net.js";
import { createVoice } from "./voice.js";
import { qrSvg } from "./qr.js";
import { firebaseConfig, WEB_URL } from "./firebase-config.js";

const $app = document.getElementById("app");
const FA = "۰۱۲۳۴۵۶۷۸۹";
const fa = (v) => String(v).replace(/[0-9]/g, (d) => FA[d]);
const toLatin = (v) => v.replace(/[۰-۹]/g, (d) => FA.indexOf(d)).replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "").slice(0, 5);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initial = (n) => esc((n || "?").trim().charAt(0));

let session = JSON.parse(localStorage.getItem("jasoos2") || "null"); // { code }
let S = null; // وضعیت آماده برای صفحه‌ها
let net = null, uid = null, skew = 0, holding = false, guessing = false, gateErr = "", copied = false, connected = true;
let notice = "", noticeTimer = 0, busy = false, leaving = false, lastSig = "", prevPhase = "";
const params = new URLSearchParams(location.search);
const save = (s) => { session = s; s ? localStorage.setItem("jasoos2", JSON.stringify(s)) : localStorage.removeItem("jasoos2"); };

/* ---------- Firebase ---------- */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
const fb = { db, doc, collection, setDoc, updateDoc, getDoc, getDocs, deleteDoc, addDoc, onSnapshot, writeBatch, serverTimestamp, query, orderBy, limitToLast, where };
const toNum = (v) => { const t = String(v).replace(/[۰-۹]/g, (d) => FA.indexOf(d)).replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, ""); return t ? parseInt(t, 10) : NaN; };
let voice = null, chatOpen = false, seenAt = 0, wordCat = "";
const qQueue = {}; let tQueue = [];

const NET_MSG = "به سرور وصل نشد. اینترنت یا فیلترشکن رو چک کن.";
const withTimeout = (p, msg = NET_MSG, t = 15000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), t))]);
const friendly = (e) => {
  const m = (e && e.message) || "", c = (e && e.code) || "";
  if (/[\u0600-\u06FF]/.test(m)) return m;
  if (c === "auth/operation-not-allowed" || c === "auth/admin-restricted-operation") return "ورود ناشناس توی Firebase روشن نیست (Authentication → Anonymous).";
  if (c === "permission-denied") return "دسترسی رد شد. قوانین Firestore رو چک کن.";
  if (c.includes("network") || c === "unavailable") return NET_MSG;
  return "یه مشکلی پیش اومد: " + (c || m || "نامشخص");
};

async function ensureNet() {
  if (net) return net;
  const user = await withTimeout(new Promise((res, rej) => {
    const un = onAuthStateChanged(auth, (u) => { if (u) { un(); res(u); } });
    signInAnonymously(auth).catch(rej);
  }));
  uid = user.uid;
  net = createNet(fb, uid, { onChange, onRoomGone, onKicked, onChat: () => renderChat(), onError: (e) => flash(friendly(e)) });
  return net;
}

function flash(msg) {
  notice = msg; render();
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { notice = ""; render(); }, 3500);
}

function stopVoice() { if (voice) { voice.destroy(); voice = null; } }
function resetRoomUi() { stopVoice(); chatOpen = false; seenAt = 0; tQueue = []; }

function onKicked() {
  resetRoomUi();
  save(null); S = null; lastSig = ""; prevPhase = "";
  gateErr = "میزبان تو رو از اتاق بیرون کرد.";
  history.replaceState(null, "", location.pathname);
  render();
}

function onRoomGone() {
  if (leaving) return;
  resetRoomUi();
  save(null); S = null; lastSig = "";
  gateErr = "اتاق بسته شد.";
  history.replaceState(null, "", location.pathname);
  render();
}

function buildS() {
  const st = net && net.state;
  if (!st || !st.room) return null;
  const r = st.room;
  skew = st.skew;
  const me = st.players.get(uid);
  const inRound = r.phase !== "lobby" && r.roster.includes(uid);
  const sec = st.secret && st.secret.round === r.round ? st.secret : null;
  const reveal = r.phase === "result" && r.result ? r.result : null;
  const amSpy = inRound && (reveal ? reveal.spies.includes(uid) : !!(sec && sec.amSpy));
  const word = reveal ? reveal.word : inRound && sec && !sec.amSpy ? sec.word : "";
  const voters = r.roster.filter((id) => st.players.has(id) && net.isOnline(id));
  const voted = r.votedIds || [];
  const mv = st.myVote && st.myVote.round === r.round ? st.myVote.target : "";
  const endsAt = (r.startedAt || Date.now() + st.skew) + r.settings.minutes * 60000;
  return {
    code: st.code,
    me: { id: uid, name: me ? me.name : "" },
    host: r.host,
    settings: r.settings,
    categories: Object.fromEntries(Object.entries(CATEGORIES).map(([k, v]) => [k, v.label])),
    players: [...st.players.values()].sort((a, b) => a.joinedAt - b.joinedAt || (a.id < b.id ? -1 : 1)).map((p) => ({ id: p.id, name: p.name, online: net.isOnline(p.id), mic: !!(p.mic && p.vs) })),
    scores: r.scores || {},
    rounds: totalRounds(r),
    played: r.played || 0,
    custom: r.custom || {},
    game: {
      phase: r.phase, round: r.round, roster: r.roster, starter: r.starter, endsAt,
      cat: inRound ? r.cat : "", word, amSpy, inRound,
      loading: inRound && !sec && !reveal,
      spies: reveal ? reveal.spies : [],
      accused: r.phase === "last" || reveal ? r.accused : "",
      guess: reveal ? reveal.guess : null,
      outcome: reveal ? reveal.outcome : "",
      reason: reveal ? reveal.reason : "",
      myVote: mv || (voted.includes(uid) ? "_" : ""),
      votedCount: voters.filter((id) => voted.includes(id)).length,
      voterCount: voters.length,
      guessWords: amSpy && (r.phase === "play" || (r.phase === "last" && r.accused === uid)) ? wordsOf(r, r.cat) : [],
    },
  };
}

function onChange() {
  if (net && net.state.code && !session) save({ code: net.state.code });
  S = buildS();
  connected = net ? net.connected() : true;
  if (S && prevPhase && prevPhase !== S.game.phase) guessing = false;
  prevPhase = S ? S.game.phase : "";
  if (voice) voice.sync();
  const sig = JSON.stringify([S, connected, !!session]);
  if (sig === lastSig) return;
  lastSig = sig;
  render();
}

const act = (type, extra) => net && net.act(type, extra);

  /* ---------- screens ---------- */

  function gate() {
    const preCode = toLatin(params.get("room") || "");
    const name = esc(localStorage.getItem("jasoos-name") || "");
    return `<div class="screen">
      <h1 class="display hero">جاسوس</h1>
      <p class="tag">همه یه کلمه رو می‌دونن. جز یه نفر.</p>

      <div class="or">یا با کد وارد شو</div>
      <form id="joinForm" class="stack">
        <input id="code" class="code" inputmode="numeric" autocomplete="off" placeholder="۰۰۰۰۰" value="${fa(preCode)}" aria-label="کد اتاق" />
        <button class="btn lamp" type="submit">ورود به اتاق</button>
      </form>
      <p class="err" role="alert">${esc(gateErr)}</p>
    </div>`;
  }

  const top = (right) => `<div class="top"><span class="display">جاسوس</span><span class="muted">${right}</span></div>`;
  const nameOf = (id) => (S.players.find((p) => p.id === id) || {}).name || "ناشناس";
  const av = (n) => `<span class="av">${initial(n)}</span>`;
  const NOSIG = `<span class="ico nosig" title="آفلاین" aria-label="آفلاین"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 20v-1.5M9 20v-4.5M14 20v-8M19 20V8" opacity=".55"/><path d="M3.5 4.5l17 15"/></svg></span>`;
  const MICI = `<span class="ico micon" title="میکروفون روشنه" aria-label="میکروفون روشنه"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>`;
  const XI = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
  const pOf = (id) => S.players.find((p) => p.id === id);
  const isOn = (id) => { const p = pOf(id); return !!(p && p.online); };
  // چیپ اسم بازیکن: آفلاین بودن، میکروفون روشن، و دکمه‌ی بیرون کردن برای میزبان
  function chip(id, { small = false } = {}) {
    const p = pOf(id) || { id, name: nameOf(id), online: false, mic: false };
    const host = S.host === S.me.id;
    return `<li class="chip ${p.id === S.me.id ? "me" : ""} ${p.online ? "" : "off"}" ${small ? 'style="font-size:14px"' : ""}>${av(p.name)}${esc(p.name)}${p.id === S.host ? " <small>میزبان</small>" : ""}${p.online ? "" : NOSIG}${p.mic ? MICI : ""}${host && p.id !== S.me.id ? `<button class="kick" data-do="kick" data-v="${p.id}" aria-label="بیرون کردن ${esc(p.name)}">${XI}</button>` : ""}</li>`;
  }
  function inviteLink() {
    let base = (WEB_URL || location.origin + location.pathname).replace(/\/index\.html$/, "").replace(/\/$/, "");
    if (!/^https?:\/\//.test(base)) base = "https://" + base;
    return base + "/?room=" + S.code;
  }
  const roundOf = () => `دور ${fa(Math.min(S.played + (S.game.phase === "result" ? 0 : 1), S.rounds))} از ${fa(S.rounds)}`;

  function lobby() {
    const isHost = S.host === S.me.id;
    const online = S.players.filter((p) => p.online);
    const enough = online.length >= 3;
    const st = S.settings;
    const cats = [...Object.entries(S.categories), ["mixed", "قاطی"]];
    const board = Object.entries(S.scores).filter(([id]) => S.players.some((p) => p.id === id)).sort((a, b) => b[1] - a[1]);
    return `<div class="screen">
      <div class="top"><span class="display">جاسوس</span><button class="link" data-do="leave">خروج از اتاق</button></div>
      <button class="ticket" data-do="copy" aria-label="کپی لینک اتاق">
        <p class="t1">کد اتاق</p><p class="display t2">${fa(S.code)}</p>
        <div class="qr" title="اسکن کن تا بیای تو اتاق">${qrSvg(inviteLink())}</div>
        <p class="t3">${copied ? "لینک کپی شد!" : "اسکن کن، یا بزن تا لینک کپی بشه"}</p>
      </button>
      <section class="mt8">
        <p class="label">سر میز <span>${enough ? fa(online.length) + " نفر" : "حداقل ۳ نفر لازمه"}</span></p>
        <ul class="chips">${S.players.map((p) => chip(p.id)).join("")}</ul>
      </section>
      <section class="mt8 stack">
        <p class="label" style="margin:0">کلمه‌ها از ${isHost ? "" : "<span>(میزبان انتخاب می‌کنه)</span>"}</p>
        <div class="pills">${cats.map(([k, l]) => `<button class="pill ${st.cat === k ? "on" : ""}" ${isHost ? `data-do="cat" data-v="${k}"` : "disabled"}>${esc(l)}</button>`).join("")}</div>
        <label class="stepper"><span>زمان هر دور</span><div class="ctl"><input id="minIn" class="num" data-set="minutes" data-max="${MAX_MINUTES}" inputmode="numeric" autocomplete="off" maxlength="3" value="${fa(st.minutes)}" ${isHost ? "" : "disabled"} aria-label="زمان هر دور به دقیقه" /><b class="unit">دقیقه</b></div></label>
        <label class="stepper"><span>تعداد دور${S.played ? `<br><small class="muted">${fa(Math.min(S.played, S.rounds))} دور بازی شده</small>` : ""}</span><div class="ctl"><input id="roundIn" class="num" data-set="rounds" data-max="${MAX_ROUNDS}" inputmode="numeric" autocomplete="off" maxlength="2" value="${fa(S.rounds)}" ${isHost ? "" : "disabled"} aria-label="تعداد دور" /><b class="unit">دور</b></div></label>
        <div class="stepper"><span>تعداد جاسوس${st.spyCount === 2 && online.length < 6 ? '<br><small class="muted">دو جاسوس از ۶ نفر به بالا</small>' : ""}</span><div class="ctl"><button ${isHost && st.spyCount < 2 ? "" : "disabled"} data-do="spy" data-v="1" aria-label="زیاد کن">+</button><b>${fa(st.spyCount)}</b><button ${isHost && st.spyCount > 1 ? "" : "disabled"} data-do="spy" data-v="-1" aria-label="کم کن">−</button></div></div>
      </section>
      ${wordSection(isHost)}
      <div class="mt8">
        ${isHost ? `<button class="btn red ${enough ? "pulse" : ""}" data-do="start" ${enough ? "" : "disabled"}>${S.played >= S.rounds ? "شروع بازی جدید" : `شروع دور ${fa(S.played + 1)} از ${fa(S.rounds)}`}</button>`
                 : `<p class="center muted blink" style="font-size:16px">منتظر میزبان (${esc(nameOf(S.host))}) که دور رو شروع کنه…</p>`}
      </div>
      ${board.length ? `<section class="mt8"><p class="label">امتیازها ${isHost ? '<button class="link" data-do="reset">صفر کن</button>' : ""}</p>
        <div class="stack">${board.map(([id, pts]) => `<div class="score">${av(nameOf(id))}${esc(nameOf(id))}<span class="display">${fa(pts)}</span></div>`).join("")}</div>
        <p class="muted">شهروند برنده: ۱ امتیاز · جاسوس برنده: ۲ امتیاز</p></section>` : ""}
    </div>`;
  }

  function wordSection(isHost) {
    const keys = Object.keys(S.categories);
    const total = keys.reduce((n, k) => n + ((S.custom[k] || []).length), 0);
    if (!isHost) return total ? `<p class="muted mt4">میزبان ${fa(total)} کلمه‌ی جدید اضافه کرده.</p>` : "";
    if (!keys.includes(wordCat)) wordCat = S.settings.cat !== "mixed" && keys.includes(S.settings.cat) ? S.settings.cat : keys[0];
    const mine = S.custom[wordCat] || [];
    return `<section class="mt8 stack">
      <p class="label" style="margin:0">اضافه کردن کلمه <span>${total ? fa(total) + " کلمه‌ی خودت" : "به بانک بازی"}</span></p>
      <form id="wordForm" class="addw" autocomplete="off">
        <select id="wordCat" class="field" aria-label="دسته">${keys.map((k) => `<option value="${k}" ${k === wordCat ? "selected" : ""}>${esc(S.categories[k])}</option>`).join("")}</select>
        <input id="wordIn" class="field" maxlength="30" placeholder="کلمه‌ی جدید" aria-label="کلمه‌ی جدید" />
        <button class="btn lamp" type="submit">اضافه</button>
      </form>
      ${mine.length ? `<ul class="chips wchips">${mine.map((w) => `<li class="chip">${esc(w)}<button class="kick" data-do="rmWord" data-v="${esc(w)}" aria-label="حذف ${esc(w)}">${XI}</button></li>`).join("")}</ul>` : ""}
    </section>`;
  }

  function clockText() {
    const left = Math.max(0, S.game.endsAt - (Date.now() + skew));
    const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
    return { text: fa(String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0")), low: left < 30000, over: left === 0 };
  }

  function card() {
    const g = S.game, cat = S.categories[g.cat];
    const face = g.amSpy
      ? `<div class="face spy"><p>نقش تو</p><span class="display">جاسوسی!</span><p>دسته: ${esc(cat)}. لو نرو.</p></div>`
      : `<div class="face citizen"><p>${esc(cat)}</p><span class="display" style="font-size:${g.word.length > 9 ? 44 : 56}px">${esc(g.word)}</span><p>تو شهروندی</p></div>`;
    return `<button class="card ${holding ? "open" : ""}" id="card" aria-label="نگه دار تا نقشت رو ببینی">${face}
      <div class="flap"><span class="stamp">پرونده محرمانه</span>
        <span class="seal"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg></span>
        <p class="hint">انگشتت رو نگه دار</p><p class="hint2">ول کنی، بسته می‌شه</p></div></button>`;
  }

  function wordGrid(title, sub) {
    return `<div class="screen">${top(`<span id="clk"></span>`)}
      <h2 class="display" style="font-size:40px;color:var(--red)">${title}</h2>
      <p class="tag" style="text-align:start;margin:4px 0 20px;font-size:16px">${sub}</p>
      <div class="grid">${S.game.guessWords.map((w) => `<button data-do="guess" data-v="${esc(w)}">${esc(w)}</button>`).join("")}</div>
      ${S.game.phase === "play" ? '<button class="link mt4" style="width:100%" data-do="noguess">بی‌خیال</button>' : ""}
    </div>`;
  }

  function play() {
    const g = S.game;
    if (guessing && g.amSpy) return wordGrid("کلمه چیه؟", "یه شانس داری. درست بگی می‌بری، غلط بگی شهر می‌بره.");
    const c = clockText();
    const meFirst = g.starter === S.me.id;
    return `<div class="screen">${top(roundOf())}
      <div class="center" style="margin-bottom:24px"><div id="clk" class="clock ${c.low ? "low" : ""}">${c.text}</div><p class="muted" id="clkNote">${c.over ? "وقت تموم شد. بریم سراغ رأی." : "تا رأی‌گیری"}</p></div>
      ${card()}
      <div class="row mt6">${av(nameOf(g.starter))}<span>اول <b>${meFirst ? "تو" : esc(nameOf(g.starter))}</b> از یکی سؤال ${meFirst ? "کن" : "کنه"}.</span></div>
      <ul class="chips mt4">${g.roster.map((id) => chip(id, { small: true })).join("")}</ul>
      <div class="grow"></div>
      <div class="stack mt8">
        <button class="btn red ${c.over ? "pulse" : ""}" data-do="toVote">بریم رأی‌گیری</button>
        ${g.amSpy ? '<button class="btn ghost" data-do="wantGuess">فهمیدم کلمه چیه</button>' : ""}
        ${S.host === S.me.id ? '<button class="link" style="width:100%" data-do="cancel">لغو این دور</button>' : ""}
      </div></div>`;
  }

  function vote() {
    const g = S.game;
    return `<div class="screen">${top(roundOf())}
      <h2 class="display" style="font-size:48px">جاسوس کیه؟</h2>
      <p class="tag" style="text-align:start;margin-top:4px;font-size:16px">رأی‌ها مخفیه تا همه رأی بدن. تساوی یعنی جاسوس قسر در رفت.</p>
      <div class="stack mt6">${g.roster.filter((id) => id !== S.me.id).map((id) => `<button class="pick ${g.myVote === id ? "on" : ""}" data-do="vote" data-v="${id}">${av(nameOf(id))}${esc(nameOf(id))}${isOn(id) ? "" : NOSIG}${g.myVote === id ? "<small>رأی تو</small>" : ""}</button>`).join("")}</div>
      <div class="grow"></div>
      <div class="mt8"><p class="muted" style="display:flex;justify-content:space-between"><span>${g.myVote ? "رأیت ثبت شد. می‌تونی عوضش کنی." : "یکی رو انتخاب کن"}</span><span>${fa(g.votedCount)} از ${fa(g.voterCount)} رأی دادن</span></p>
        <div class="bar"><i style="width:${(g.votedCount / Math.max(1, g.voterCount)) * 100}%"></i></div>
        ${g.votedCount > 0 && g.votedCount < g.voterCount ? '<button class="link mt4" style="width:100%" data-do="countNow">منتظر نمون، همین الان بشمر</button>' : ""}</div>
    </div>`;
  }

  function last() {
    const g = S.game;
    if (g.accused === S.me.id) return wordGrid("گیر افتادی.", "ولی هنوز یه راه داری: کلمه رو درست حدس بزن، می‌بری.");
    return `<div class="screen" style="justify-content:center;text-align:center">
      <p class="display blink" style="font-size:60px;color:var(--lamp)">${esc(nameOf(g.accused))}</p>
      <p style="font-size:18px">جاسوس بود! داره آخرین حدسش رو می‌زنه…</p>
      <p class="muted" style="font-size:16px">اگه کلمه رو بگه، باز هم می‌بره.</p></div>`;
  }

  function result() {
    const g = S.game, spyWon = g.outcome === "spy", iWon = spyWon === g.amSpy;
    const why = { tie: "رأی‌ها مساوی شد، کسی بیرون نرفت.", wrong: `شهر اشتباهی ${nameOf(g.accused)} رو گرفت.`,
      early: g.guess ? `${nameOf(g.guess.by)} زد «${g.guess.word}». ${spyWon ? "درست بود." : "غلط بود."}` : "",
      last: g.guess ? `حدس آخر: «${g.guess.word}». ${spyWon ? "درست بود!" : "غلط بود."}` : "",
      kicked: "جاسوس از بازی بیرون شد." }[g.reason] || "";
    const over = S.played >= S.rounds;
    const board = Object.entries(S.scores).sort((a, b) => b[1] - a[1]);
    const best = board.length ? board[0][1] : 0;
    const champs = board.filter(([, p]) => p === best && p > 0).map(([id]) => id);
    const final = over ? `<div class="champ mt4"><p class="label" style="margin:0">پایان بازی، ${fa(S.rounds)} دور</p>
        <p class="display" style="margin:4px 0 12px">${champs.length ? (champs.length > 1 ? "مساوی: " : "قهرمان: ") + champs.map((id) => (id === S.me.id ? "تو" : esc(nameOf(id)))).join(" و ") : "کسی امتیاز نگرفت"}</p>
        <div class="stack">${board.map(([id, pts]) => `<div class="score ${champs.includes(id) ? "top" : ""}">${av(nameOf(id))}${esc(nameOf(id))}<span class="display">${fa(pts)}</span></div>`).join("")}</div></div>` : "";
    return `<div class="screen">${top(roundOf())}
      <div class="center" style="padding:24px 0;display:flex;flex-direction:column;align-items:center">
        <div class="verdict ${spyWon ? "v-spy" : "v-town"}"><span class="display">${spyWon ? "جاسوس برد" : "جاسوس گیر افتاد"}</span></div>
        <p style="font-size:18px;font-weight:700;margin-top:20px">${iWon ? "تو بردی." : "تو باختی."} <span style="font-weight:400;color:var(--soft)">${esc(why)}</span></p></div>
      <div class="box center" style="background:var(--lamp);color:var(--ink)"><p style="margin:0;font-weight:700;opacity:.7">کلمه بود</p><p class="display" style="font-size:48px">${esc(g.word)}</p></div>
      <div class="box mt4" style="background:var(--night)"><p class="label">${g.spies.length > 1 ? "جاسوس‌ها" : "جاسوس"}</p>
        <div class="stack">${g.spies.map((id) => `<div style="display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px">${av(nameOf(id))}${id === S.me.id ? "خودت" : esc(nameOf(id))}</div>`).join("")}</div></div>
      ${final}
      <div class="grow"></div>
      <div class="mt8"><button class="btn lamp" data-do="lobby">${over ? "برگرد سر میز (بازی جدید)" : "برگرد سر میز، دور بعد"}</button></div></div>`;
  }

  function spectator() {
    return `<div class="screen" style="justify-content:center;text-align:center">
      <p class="display" style="font-size:60px;color:var(--lamp)">جاسوس</p>
      <p style="font-size:18px">یه دور در جریانه.</p><p class="muted" style="font-size:16px">دور بعد تو هم بازی می‌کنی.</p>
      <div class="ticket mt6" style="cursor:default"><p class="t1">کد اتاق</p><p class="display t2">${fa(S.code)}</p></div></div>`;
  }


  const LOADING = `<div class="screen" style="justify-content:center;text-align:center"><p class="display" style="font-size:56px;color:var(--lamp)">جاسوس</p><p class="muted">در حال وصل شدن…</p></div>`;
  let lastKey = "";
  function render() {
    let html;
    if (!session) html = gate();
    else if (!S || S.game.loading) html = LOADING;
    else {
      const p = S.game.phase;
      html = p === "lobby" ? lobby() : !S.game.inRound ? spectator() : p === "play" ? play() : p === "vote" ? vote() : p === "last" ? last() : result();
      if (!connected) html = `<p class="banner">اتصال قطع شد، دارم دوباره وصل می‌شم…</p>` + html;
    }
    if (notice) html = `<p class="banner">${esc(notice)}</p>` + html;
    // انیمیشن ورود فقط وقتی صفحه عوض می‌شه
    const key = session ? (S && !S.game.loading ? S.game.phase + S.game.inRound + guessing : "load") : "gate";
    const keepInputs = !session && document.getElementById("name");
    if (keepInputs && lastKey === key && !notice) { document.querySelector(".err").textContent = gateErr; renderDock(); return; }
    const ae = document.activeElement;
    const keep = ae && ae.id && ae.tagName === "INPUT" && $app.contains(ae) ? { id: ae.id, v: ae.value, a: ae.selectionStart, b: ae.selectionEnd } : null;
    $app.innerHTML = html;
    if (keep) { const el = document.getElementById(keep.id); if (el && !el.disabled) { el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.a, keep.b); } catch {} } }
    renderDock();
    if (lastKey === key) { const sc = $app.querySelector(".screen"); if (sc) sc.style.animation = "none"; }
    lastKey = key;
    bind();
  }

  const setErr = (m) => { gateErr = m; const e = document.querySelector(".err"); if (e) e.textContent = m; };

  async function enter(promiseFn, c) {
    if (busy) return;
    busy = true;
    try {
      const n = await ensureNet();
      await withTimeout(promiseFn(n), NET_MSG, 20000);
      gateErr = "";
      save({ code: c || net.state.code });
      history.replaceState(null, "", "?room=" + (c || net.state.code));
      onChange();
      render();
    } catch (err) { gateErr = friendly(err); render(); }
    finally { busy = false; }
  }

  function bind() {
    const card = document.getElementById("card");
    if (card) {
      const open = (e) => { e.preventDefault(); holding = true; card.classList.add("open"); };
      card.addEventListener("pointerdown", open);
      card.addEventListener("contextmenu", (e) => e.preventDefault());
      card.addEventListener("keydown", (e) => (e.key === " " || e.key === "Enter") && open(e));
    }
    document.querySelectorAll("input.num[data-set]").forEach((inp) => {
      const commit = () => {
        const key = inp.dataset.set, max = Number(inp.dataset.max), cur = key === "rounds" ? S.rounds : S.settings[key];
        const n = toNum(inp.value);
        if (!Number.isInteger(n) || n < 1) { inp.value = fa(cur); return flash("یه عدد بزرگ‌تر از صفر بنویس"); }
        const v = Math.min(max, n);
        inp.value = fa(v);
        if (v !== cur) act("settings", { [key]: v });
        if (n > max) flash(`حداکثر ${fa(max)}`);
      };
      inp.addEventListener("input", () => { const t = inp.value.replace(/[0-9]/g, (d) => FA[d]).replace(/[^۰-۹٠-٩]/g, ""); if (t !== inp.value) inp.value = t; });
      inp.addEventListener("change", commit);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } });
      inp.addEventListener("focus", () => inp.select());
    });
    const wf = document.getElementById("wordForm");
    if (wf) {
      document.getElementById("wordCat").addEventListener("change", (e) => { wordCat = e.target.value; render(); });
      wf.addEventListener("submit", (e) => {
        e.preventDefault();
        const inp = document.getElementById("wordIn"), w = inp.value.trim();
        if (!w) return inp.focus();
        act("addWord", { cat: wordCat, word: w });
        inp.value = "";
        flash(`«${w}» به ${S.categories[wordCat]} اضافه شد`);
        setTimeout(() => { const i = document.getElementById("wordIn"); if (i) i.focus(); }, 0);
      });
    }
    const code = document.getElementById("code");
    if (code) code.addEventListener("input", () => { const v = toLatin(code.value); code.value = fa(v); gateErr = ""; document.querySelector(".err").textContent = ""; });
    const form = document.getElementById("joinForm");
    if (form) form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const c = toLatin(code.value);
      if (!name) { gateErr = "اول اسمت رو بنویس."; return render(); }
      if (c.length !== 5) { gateErr = "کد ۵ رقمیه."; return render(); }
      localStorage.setItem("jasoos-name", name);
      setErr("در حال ورود…");
      enter((n) => n.joinRoom(name, c), c);
    });
  }

  const closeCard = () => { if (!holding) return; holding = false; const c = document.getElementById("card"); if (c) c.classList.remove("open"); };
  ["pointerup", "pointercancel", "keyup", "blur"].forEach((ev) => window.addEventListener(ev, closeCard));

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-do]");
    if (!b) return;
    const v = b.dataset.v, d = b.dataset.do;
    if (d === "create") {
      const name = document.getElementById("name").value.trim();
      if (!name) { gateErr = "اول اسمت رو بنویس."; return render(); }
      localStorage.setItem("jasoos-name", name);
      setErr("در حال ساختن اتاق…");
      enter((n) => n.createRoom(name));
    }
    else if (d === "copy") {
      const canLink = WEB_URL || (/^https?:$/.test(location.protocol) && location.hostname !== "localhost");
      const base = (WEB_URL || location.origin + location.pathname).replace(/\/index\.html$/, "").replace(/\/$/, "");
      const link = base + "/?room=" + S.code;
      const text = "بیا جاسوس بازی. کد اتاق: " + S.code;
      try {
        if (navigator.share && matchMedia("(pointer:coarse)").matches) await navigator.share(canLink ? { title: "جاسوس", text, url: link } : { title: "جاسوس", text });
        else await navigator.clipboard.writeText(canLink ? link : text);
        copied = true; render(); setTimeout(() => { copied = false; render(); }, 1600);
      } catch {}
    }
    else if (d === "leave") {
      leaving = true;
      resetRoomUi();
      await net.leave();
      leaving = false;
      save(null); S = null; lastSig = ""; prevPhase = "";
      history.replaceState(null, "", location.pathname);
      render();
    }
    else if (d === "cat") { if (v !== "mixed") wordCat = v; act("settings", { cat: v }); }
    else if (d === "kick") {
      if (confirm(`${nameOf(v)} رو از اتاق بیرون کنم؟ دیگه نمی‌تونه برگرده.`)) act("kick", { target: v });
    }
    else if (d === "rmWord") act("removeWord", { cat: wordCat, word: v });
    else if (d === "chat") { chatOpen = !chatOpen; renderDock(); if (chatOpen) { renderChat(true); setTimeout(() => { const i = document.getElementById("chatIn"); if (i && matchMedia("(pointer:fine)").matches) i.focus(); }, 50); } }
    else if (d === "closeChat") { chatOpen = false; renderDock(); }
    else if (d === "rq") randomQuestion();
    else if (d === "mic" || d === "spk") toggleVoice(d);
    else if (d === "spy") act("settings", { spyCount: S.settings.spyCount + Number(v) });
    else if (d === "start") act("start");
    else if (d === "reset") act("resetScores");
    else if (d === "toVote") act("toVote");
    else if (d === "wantGuess") { guessing = true; render(); }
    else if (d === "noguess") { guessing = false; render(); }
    else if (d === "guess") act("guess", { word: v });
    else if (d === "vote") { act("vote", { target: v }); onChange(); }
    else if (d === "countNow") act("countNow");
    else if (d === "cancel" || d === "lobby") act("lobby");
  });

  /* ---------- داک پایین: چت و صدا ---------- */

  const $dock = document.getElementById("dock");
  const IC = {
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
    micOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 9.5V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 4.6 2.5M18.5 11a6.5 6.5 0 0 1-1 3.4M5.5 11a6.5 6.5 0 0 0 10.2 5.4M12 17.5V21M3.5 3.5l17 17"/></svg>',
    hp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4.5" height="7" rx="2"/><rect x="16" y="14" width="4.5" height="7" rx="2"/></svg>',
    hpOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 12.4-6.7M19.4 9.4A8 8 0 0 1 20 12v3"/><rect x="3.5" y="14" width="4.5" height="7" rx="2"/><path d="M16 17.5V21h2.5a2 2 0 0 0 2-2v-2.5M3.5 3.5l17 17"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5.5h16v11H10l-4.5 3.5v-3.5H4z"/><path d="M8 10h8M8 13h5" stroke-linecap="round"/></svg>',
    send: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M20 4L3.5 11l6.5 2.5L12.5 20z"/><path d="M10 13.5L20 4" stroke-linecap="round"/></svg>',
    dice: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/></svg>',
  };

  function renderDock() {
    const inRoom = !!(session && S && !S.game.loading);
    document.body.classList.toggle("inroom", inRoom);
    if (!inRoom) { $dock.innerHTML = ""; return; }
    if (!document.getElementById("sheet")) {
      $dock.innerHTML = `<section class="sheet" id="sheet" aria-label="چت اتاق">
          <div class="sheet-h"><span class="display">چت اتاق</span><button class="link" data-do="closeChat">بستن</button></div>
          <div class="msgs" id="msgs"></div>
          <div class="composer">
            <form id="chatForm" autocomplete="off"><input id="chatIn" class="field" maxlength="300" placeholder="بپرس یا جواب بده…" aria-label="پیام" /><button class="send" type="submit" aria-label="فرستادن">${IC.send}</button></form>
            <button class="btn qbtn" data-do="rq">${IC.dice} سؤال رندوم</button>
          </div>
        </section>
        <nav class="dockbar" id="dockBar"></nav>`;
      document.getElementById("chatForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const inp = document.getElementById("chatIn"), t = inp.value.trim();
        if (!t || !net) return;
        inp.value = "";
        net.sendChat({ text: t }).catch((err) => flash(friendly(err)));
      });
      renderChat(true);
    }
    const unread = unreadCount();
    const mic = !!(voice && voice.mic), spk = !!(voice && voice.speaker), n = voice ? voice.connectedCount() : 0;
    document.getElementById("sheet").classList.toggle("open", chatOpen);
    document.getElementById("dockBar").innerHTML = `
      <button class="dk mic ${mic ? "on" : ""}" data-do="mic" aria-pressed="${mic}">${mic ? '<i class="live"></i>' : ""}${mic ? IC.mic : IC.micOff}<span>${mic ? "میکروفون روشن" : "میکروفون"}</span></button>
      <button class="dk chatb ${chatOpen ? "open" : ""}" data-do="chat" aria-expanded="${chatOpen}">${IC.chat}<span>${chatOpen ? "بستن چت" : "چت"}</span>${unread && !chatOpen ? `<b class="badge">${fa(Math.min(unread, 99))}</b>` : ""}</button>
      <button class="dk ${spk ? "on" : ""}" data-do="spk" aria-pressed="${spk}">${spk ? '<i class="live"></i>' : ""}${spk ? IC.hp : IC.hpOff}<span>${spk ? (n ? `هدفون (${fa(n)} نفر)` : "هدفون روشن") : "هدفون"}</span></button>`;
  }

  const chatList = () => (net && net.state.chat) || [];
  function unreadCount() {
    return chatList().filter((m) => m.at > seenAt && m.by !== uid).length;
  }

  function renderChat(force) {
    const box = document.getElementById("msgs");
    const list = chatList();
    if (chatOpen && list.length) seenAt = Math.max(seenAt, list[list.length - 1].at || 0);
    if (!box) return;
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = list.length ? list.map((m) => {
      if (m.kind === "q") {
        const forMe = m.target === uid;
        return `<div class="msg q ${forMe ? "forme" : ""}"><span class="qh">${IC.dice} سؤال از <b>${forMe ? "تو" : esc(m.tname)}</b></span><p>${esc(m.text)}</p><small>${m.by === uid ? "تو" : esc(m.name)} پرسید</small></div>`;
      }
      return `<div class="msg ${m.by === uid ? "me" : ""}"><small>${esc(m.name)}</small><p>${esc(m.text)}</p></div>`;
    }).join("") : `<p class="empty">هنوز کسی چیزی نگفته. یه سؤال بپرس، یا «سؤال رندوم» رو بزن.</p>`;
    if (force || near || (list.length && list[list.length - 1].by === uid)) box.scrollTop = box.scrollHeight;
    if (!force) renderDock();
  }

  // سؤال رندوم: یه نفر از بازیکن‌ها (غیر از خودت) و یه سؤال مربوط به دسته‌ی این دور
  function randomQuestion() {
    if (!S || !net) return;
    const g = S.game;
    const ids = (g.inRound && g.phase !== "lobby" ? g.roster : S.players.map((p) => p.id)).filter((id) => id !== S.me.id && isOn(id));
    if (!ids.length) return flash("کسی آنلاین نیست که ازش سؤال بپرسی");
    tQueue = tQueue.filter((id) => ids.includes(id));
    if (!tQueue.length) tQueue = ids.slice().sort(() => Math.random() - 0.5);
    const target = tQueue.shift();
    const cat = g.inRound && QUESTIONS[g.cat] ? g.cat : "general";
    if (!qQueue[cat] || !qQueue[cat].length) qQueue[cat] = QUESTIONS[cat].slice().sort(() => Math.random() - 0.5);
    const text = qQueue[cat].shift();
    net.sendChat({ kind: "q", text, target, tname: nameOf(target) }).catch((err) => flash(friendly(err)));
  }

  async function toggleVoice(kind) {
    if (!net || !S) return;
    if (!voice) voice = createVoice(fb, uid, S.code, net, { onChange: renderDock });
    try {
      if (kind === "mic") await voice.setMic(!voice.mic);
      else await voice.setSpeaker(!voice.speaker);
    } catch (e) {
      const n = (e && e.name) || "";
      flash(n === "NotAllowedError" || n === "SecurityError" ? "اجازه‌ی میکروفون داده نشد. از تنظیمات مرورگر یا اپ اجازه بده." : n === "NotFoundError" ? "میکروفونی پیدا نشد." : friendly(e));
    }
    renderDock();
  }

  document.addEventListener("visibilitychange", () => { if (!document.hidden && net) { net.beat(); net.tick(); } });

  setInterval(() => {
    if (!S || S.game.phase !== "play") return;
    const el = document.getElementById("clk"); if (!el) return;
    const c = clockText(); el.textContent = c.text; el.classList.toggle("low", c.low);
    const n = document.getElementById("clkNote"); if (n) n.textContent = c.over ? "وقت تموم شد. بریم سراغ رأی." : "تا رأی‌گیری";
  }, 500);

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

  (async function boot() {
    render();
    if (session) {
      try {
        const n = await ensureNet();
        const ok = await withTimeout(n.resume(session.code));
        if (!ok) { save(null); gateErr = "اتاق قبلی پیدا نشد."; }
        else onChange();
      } catch (err) { save(null); gateErr = friendly(err); }
      render();
    } else {
      ensureNet().catch(() => {});
    }
  })();
</script>
</body>
</html>
